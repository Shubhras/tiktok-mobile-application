plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}


def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")

if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.digi.zoyoshorts"
    compileSdk = 36
    ndkVersion "29.0.14033849"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }

    defaultConfig {
        applicationId = "com.digi.zoyoshorts"
        minSdk = 24
        targetSdk = 36
        versionCode = 4
        versionName = "1.0.3"
    }

    // =========================
    // SIGNING CONFIG (SAFE)
    // =========================
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            shrinkResources false
            minifyEnabled false

            // SAFE FALLBACK (prevents crash)
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    // Align Media3 with retrytech_plugin (1.6.1).
    // Media3 1.8+ moved Muxer.Factory out of transformer and crashes
    // applyFilterAndAudioToVideo with NoClassDefFoundError.
    implementation 'androidx.media3:media3-common:1.6.1'
    implementation 'androidx.media3:media3-effect:1.6.1'
    implementation 'androidx.media3:media3-transformer:1.6.1'
    implementation 'androidx.media3:media3-exoplayer:1.6.1'
}

configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'androidx.media3') {
            details.useVersion '1.6.1'
            details.because 'Match retrytech_plugin Media3 1.6.1 (Muxer$Factory)'
        }
    }
}

flutter {
    source = "../.."
}